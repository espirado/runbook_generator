[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-generator"
version = "0.1.0"
description = "Generate operational runbooks from live cloud and cluster environments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "runbook_generator contributors" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
runbook-generator = "runbook_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runbook_generator = ["llm/prompts/*.md"]
